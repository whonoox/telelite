<title>{{ chat_name }}</title>
<h1>{{ chat_name }}</h1>
{% if error %}<p>Error: {{ error }}</p>{% endif %}
{% if has_more %}
<p><a href="{{ url_for('web.conversation', chat_id=chat_id, before_id=oldest_id, name=chat_name) }}">Older messages</a></p>
{% endif %}
<ul>
{% for m in messages %}
<li>{% if m.out %}Me{% else %}Them{% endif %}: {{ m.text }}</li>
{% endfor %}
</ul>
<form method="post" action="{{ url_for('web.reply', chat_id=chat_id) }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<input type="hidden" name="name" value="{{ chat_name }}">
<p><textarea name="text" rows="3" cols="20">{{ draft_text }}</textarea></p>
<p><input type="submit" value="Send"></p>
</form>
<p><a href="{{ url_for('web.chats') }}">Back to chats</a></p>
