{% extends "base.html" %}
{% block title %}TeleLite Login{% endblock %}
{% block body %}
<div class="bar"><a class="back" href="/web/login">&laquo;</a> Enter code</div>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" action="/web/login/verify" class="pad">
<input type="hidden" name="pending_id" value="{{ pending_id }}">
<div class="field">
<label for="code">Login code</label>
<input class="input" type="text" id="code" name="code" size="10">
<div class="hint">Telegram sent it to your other devices.</div>
</div>
{% if needs_password %}
<div class="field">
<label for="password">2FA password</label>
<input class="input" type="password" id="password" name="password" size="20">
</div>
{% endif %}
<input class="btn" type="submit" value="Log in">
</form>
{% endblock %}
