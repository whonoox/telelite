<title>TeleLite Chats</title>
<h1>Chats</h1>
{% if error %}<p>Error: {{ error }}</p>{% endif %}
{% if chats %}
<ol>
{% for chat in chats %}
<li>{% if chat.has_photo %}<img src="{{ url_for('web.avatar', chat_id=chat.chat_id) }}" width="24" height="24" alt=""> {% endif %}<a href="{{ url_for('web.conversation', chat_id=chat.chat_id, name=chat.name, can_reply=(1 if chat.can_reply else 0)) }}">{{ chat.name }}{% if chat.unread_count %} ({{ chat.unread_count }}){% endif %}</a></li>
{% endfor %}
</ol>
{% else %}
<p>No chats found.</p>
{% endif %}
<form method="post" action="/web/logout">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<p><input type="submit" value="Logout"></p>
</form>
