{% extends "base.html" %}
{% block title %}TeleLite Login{% endblock %}
{% block body %}
<div class="bar">TeleLite <span class="sub">Telegram for any phone</span></div>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" action="/web/login" class="pad">
<div class="field">
<label for="phone">Phone number</label>
<input class="input" type="text" id="phone" name="phone_number" value="{{ phone_number }}" size="20">
<div class="hint">Include the country code, e.g. +251...</div>
</div>
<input class="btn" type="submit" value="Send code">
</form>
{% endblock %}
