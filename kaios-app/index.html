<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeleLite</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header"><span id="header-title">TeleLite</span></div>
<div id="error-banner" class="hidden"></div>

<div id="screen-login-phone" class="screen">
  <p>Enter your phone number:</p>
  <input type="text" id="phone-input">
</div>

<div id="screen-login-code" class="screen hidden">
  <p>Enter the code sent to your Telegram:</p>
  <input type="text" id="code-input">
  <div id="password-field" class="hidden">
    <p>2FA password:</p>
    <input type="password" id="password-input">
  </div>
</div>

<div id="screen-chats" class="screen hidden">
  <ul id="chat-list"></ul>
</div>

<div id="screen-conversation" class="screen hidden">
  <div id="older-link" class="hidden"><span id="older-item" class="list-item">-- Older messages --</span></div>
  <ul id="message-list"></ul>
  <div id="reply-container">
    <p>Reply:</p>
    <textarea id="reply-input" rows="3"></textarea>
  </div>
</div>

<div id="softkeys">
  <span id="sk-left" class="softkey"></span>
  <span id="sk-center" class="softkey"></span>
  <span id="sk-right" class="softkey"></span>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
